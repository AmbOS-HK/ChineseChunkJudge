openapi: 3.1.0
info:
  title: ChineseChunkJudge Adjudication API
  version: 0.10.0
  description: >-
    切片判定服务的 HTTP 契约。请求与响应结构引用 contract/schema 下的 JSON Schema，
    与 contract/rules.md 同属权威标准。参考实现为进程内库，本契约用于跨语言一致性验证。
  contact:
    name: AmbOS-HK
    url: https://github.com/AmbOS-HK
license:
  name: MIT
  url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:5180/v1
    description: 本地判定服务
tags:
  - name: contract
    description: 契约元信息
  - name: judge
    description: 切片判定
paths:
  /rules:
    get:
      tags: [contract]
      operationId: listRules
      summary: 列出当前生效的判定规则
      responses:
        '200':
          description: 规则清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleManifest'
  /chunks/normalize:
    post:
      tags: [judge]
      operationId: normalizeChunks
      summary: 将原始切片归一化为契约切片（只归一化，不判定）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizeRequest'
      responses:
        '200':
          description: 契约切片数组，顺序与请求中 index 一致
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './schema/contract-chunk.json'
        '400':
          $ref: '#/components/responses/BadRequest'
  /judge:
    post:
      tags: [judge]
      operationId: judgeChunks
      summary: 对调用方提交的原始切片执行判定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeRequest'
      responses:
        '200':
          description: 判定报告
          content:
            application/json:
              schema:
                $ref: './schema/judge-report.json'
        '400':
          $ref: '#/components/responses/BadRequest'
  /judge/contract-chunks:
    post:
      tags: [judge]
      operationId: judgeContractChunks
      summary: 对调用方已构造好的契约切片执行判定（不重新归一化）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JudgeContractChunksRequest'
      responses:
        '200':
          description: 判定报告
          content:
            application/json:
              schema:
                $ref: './schema/judge-report.json'
        '400':
          $ref: '#/components/responses/BadRequest'
  /templates/resolve:
    post:
      tags: [judge]
      operationId: resolveChunkTemplate
      summary: 选型判定：按规则模板决策切分方式与参数，不执行切分
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateResolveRequest'
      responses:
        '200':
          description: 模板决策结果（命中规则或强制兜底）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDecision'
        '400':
          $ref: '#/components/responses/BadRequest'
  /packages/parent-child:
    post:
      tags: [judge]
      operationId: buildParentChildPackage
      summary: 生成双库独立产物包（上下文父块 + 父子配对），与判定报告解耦
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRequest'
      responses:
        '200':
          description: 父子产物包
          content:
            application/json:
              schema:
                $ref: './schema/parent-child-package.json'
        '400':
          $ref: '#/components/responses/BadRequest'
  /judge/execute:
    post:
      tags: [judge]
      operationId: judgeWithExecutor
      summary: 由服务端已注册的执行器完成切片并判定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: 判定报告
          content:
            application/json:
              schema:
                $ref: './schema/judge-report.json'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 执行器未注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  responses:
    BadRequest:
      description: 请求不符合契约（含 CCJ-007 选项非法）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    NormalizeRequest:
      type: object
      additionalProperties: false
      required: [document, options, rawChunks]
      properties:
        document:
          $ref: './schema/document-feature.json'
        options:
          $ref: './schema/chunk-strategy-options.json'
        rawChunks:
          type: array
          items:
            $ref: './schema/raw-chunk.json'
        parentChunks:
          type: array
          description: 可选，双库上下文父块；parentChild.enabled=false 时不得携带，携带返回 400 invalid_request（rules.md §3.2）。
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChunk'
        pairs:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChildPair'
    JudgeRequest:
      type: object
      additionalProperties: false
      required: [document, options, rawChunks]
      properties:
        document:
          $ref: './schema/document-feature.json'
        options:
          $ref: './schema/chunk-strategy-options.json'
        rawChunks:
          type: array
          items:
            $ref: './schema/raw-chunk.json'
        parentChunks:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChunk'
        pairs:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChildPair'
    JudgeContractChunksRequest:
      type: object
      additionalProperties: false
      required: [document, options, chunks]
      properties:
        document:
          $ref: './schema/document-feature.json'
        options:
          $ref: './schema/chunk-strategy-options.json'
        chunks:
          type: array
          items:
            $ref: './schema/contract-chunk.json'
        parentChunks:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChunk'
        pairs:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChildPair'
    TemplateResolveRequest:
      type: object
      additionalProperties: false
      required: [documentCategories, traits]
      oneOf:
        - required: [template]
          not: { required: [templates] }
        - required: [templates]
          not: { required: [template] }
      properties:
        template:
          $ref: './schema/chunk-rule-template.json'
          deprecated: true
          description: 单模板（兼容保留至 1.0.0）。与 templates 恰好提供一个；该形态下 appliesTo 不参与准入。
        templates:
          type: array
          minItems: 1
          description: 候选模板集（0.8.0）。与 template 恰好提供一个；顺序即优先级。
          items:
            $ref: './schema/chunk-rule-template.json'
        documentCategories:
          type: array
          items:
            type: string
            minLength: 1
        traits:
          type: array
          items:
            $ref: './schema/chunk-rule-template.json#/$defs/trait'
    TemplateDecision:
      type: object
      additionalProperties: false
      required: [templateId, chunkMode, chunkSize, usedFallback, candidateCount, selectionReason]
      if:
        properties: { usedFallback: { const: true } }
      then:
        properties:
          selectionReason: { const: fallback }
        not: { required: [matchedRuleIndex] }
      else:
        properties:
          selectionReason: { const: rule_matched }
        required: [matchedRuleIndex]
      properties:
        templateId:
          type: string
          description: 实际选中的模板 ID。
        matchedRuleIndex:
          type: integer
          minimum: 0
          description: 命中的规则下标；usedFallback=true 时缺省。
        usedFallback:
          type: boolean
        candidateCount:
          type: integer
          minimum: 1
          description: 经类别过滤后的候选模板数；单模板形态固定为 1。
        selectionReason:
          type: string
          enum: [rule_matched, fallback]
        chunkMode:
          $ref: './schema/chunk-rule-template.json#/$defs/chunkMode'
        strategyType:
          $ref: './schema/chunk-rule-template.json#/$defs/strategyType'
        pattern:
          type: string
        chunkSize:
          type: integer
        parentChild:
          $ref: './schema/chunk-strategy-options.json#/properties/parentChild'
    PackageRequest:
      type: object
      additionalProperties: false
      required: [document, options, rawChunks, parentChunks, pairs]
      properties:
        document:
          $ref: './schema/document-feature.json'
        options:
          $ref: './schema/chunk-strategy-options.json'
        rawChunks:
          type: array
          items:
            $ref: './schema/raw-chunk.json'
        parentChunks:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChunk'
        pairs:
          type: array
          items:
            $ref: './schema/parent-child-package.json#/$defs/contextParentChildPair'
    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [document, options, executor]
      properties:
        document:
          $ref: './schema/document-feature.json'
        options:
          $ref: './schema/chunk-strategy-options.json'
        executor:
          type: string
          minLength: 1
          description: 已注册执行器的标识，取值为策略类型，例如 structure
          examples: [structure]
    RuleManifest:
      type: object
      additionalProperties: false
      required: [contractVersion, rules]
      properties:
        contractVersion:
          type: string
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDescriptor'
    RuleDescriptor:
      type: object
      additionalProperties: false
      required: [ruleId, description, severity, isBaseRule]
      properties:
        ruleId:
          type: string
          pattern: '^CCJ-(?:[0-9]{3}|X[0-9]{3})$'
        description:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        isBaseRule:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_options, invalid_chunk, no_applicable_template, executor_not_registered]
              description: 封闭枚举，新增码需升版（见 rules.md §13.4）。
            message:
              type: string
            detail:
              type: object
              additionalProperties:
                type: string
