name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-version:
    name: contract version (3 places must match)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check contract version is identical in rules.md / openapi.yaml / ContractConstants
        run: python3 scripts/check_contract_version.py

  build-and-test:
    name: build & test (net10.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/csharp
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ChineseChunkJudge.sln

      - name: Build
        run: dotnet build ChineseChunkJudge.sln --no-restore -c Release

      - name: Test
        run: dotnet test ChineseChunkJudge.sln --no-build -c Release --logger "console;verbosity=minimal"
